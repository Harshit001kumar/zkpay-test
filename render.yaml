services:
  - type: web
    name: zk-pay
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: NEXT_PUBLIC_INFURA_API_KEY
        sync: false
      - key: NEAR_INTENTS_API_KEY
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      - key: ADMIN_PRIVY_DIDS
        sync: false
      - key: SWEEPER_IDLE_INTERVAL_MS
        value: "120000"
      - key: PAYIN_MASTER_SECRET
        generateValue: true
      - key: ZKPAY_API_KEY_HASH_SALT
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
